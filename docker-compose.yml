services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: gemelo_digital_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bd_gemelodigital
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_gemelodigital"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gemelo_digital_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gemelo_digital_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/bd_gemelodigital
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/bd_gemelodigital_test
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=gemelo-digital-super-secret-jwt-key-2026-production-ready
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENVIRONMENT=development
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000","http://127.0.0.1:8000"]
      - UPLOAD_DIR=/app/uploads
      - LOG_FILE=/app/logs/app.log
      - REPORT_TEMP_DIR=/app/temp/reports
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gemelo_digital_celery
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/bd_gemelodigital
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=gemelo-digital-super-secret-jwt-key-2026-production-ready
      - ENVIRONMENT=development
      - UPLOAD_DIR=/app/uploads
      - LOG_FILE=/app/logs/celery.log
      - REPORT_TEMP_DIR=/app/temp/reports
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    container_name: gemelo_digital_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  backend_uploads:
  backend_logs:
